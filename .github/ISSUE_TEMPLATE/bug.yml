name: Bug report
description: Reproduce a problem using synthetic data
body:
  - type: textarea
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction and environment
      description: Commit/version, device/browser, backend mode, steps. Never post credentials or personal records.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Redacted logs or screenshots
